<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>HLAE Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">

    <div>
      <div class="title" data-l10n="WindowTitle"></div>
      <div class="subtitle" id="header-version"></div>
    </div>
  </header>

  <main>
    <section class="page" id="page-loading"></section>

    <section class="page" id="page-install" hidden>
      <h1 id="install-heading" tabindex="-1"></h1>
      <p class="notice" id="no-payload" hidden><span data-l10n="NoPayload"></span></p>
      <p class="notice" id="legacy-notice" hidden></p>

      <div class="field">
        <label for="install-dir" data-l10n="InstallDirLabel"></label>
        <div class="row">
          <input id="install-dir" type="text" spellcheck="false" autocomplete="off" aria-describedby="install-dir-error install-dir-fixed">
          <button type="button" id="browse-dir" data-l10n="BrowseButton"></button>
        </div>
        <p class="hint" id="install-dir-fixed" data-l10n="InstallDirFixed" hidden></p>
        <p class="error" id="install-dir-error" role="alert" hidden></p>
      </div>

      <label class="check"><input type="checkbox" id="locales"><span data-l10n="LocalesLabel"></span></label>

      <fieldset class="ffmpeg">
        <legend data-l10n="FfmpegLegend"></legend>
        <label class="check"><input type="radio" name="ffmpeg" value="download"><span data-l10n="FfmpegDownload"></span></label>
        <div class="sub" data-for="download">
          <select id="ffmpeg-variant" aria-label="FFMPEG"></select>
          <p class="hint" data-l10n="FfmpegDownloadNote"></p>
        </div>
        <label class="check"><input type="radio" name="ffmpeg" value="custom"><span data-l10n="FfmpegCustom"></span></label>
        <div class="sub" data-for="custom">
          <div class="row">
            <input id="ffmpeg-exe" type="text" spellcheck="false" autocomplete="off" aria-label="ffmpeg.exe" aria-describedby="ffmpeg-exe-error">
            <button type="button" id="browse-exe" data-l10n="BrowseButton"></button>
          </div>
          <p class="error" id="ffmpeg-exe-error" role="alert" hidden></p>
        </div>
        <label class="check" id="ffmpeg-keep-option" hidden><input type="radio" name="ffmpeg" value="keep"><span id="ffmpeg-keep-label"></span></label>
        <label class="check"><input type="radio" name="ffmpeg" value="none"><span id="ffmpeg-none-label"></span></label>
      </fieldset>

      <p class="notice" id="dotnet-missing" hidden></p>

      <footer class="buttons">
        <button type="button" id="install-back" data-l10n="BackButton" hidden></button>
        <span class="spacer"></span>
        <button type="button" id="install-cancel" data-l10n="CancelButton"></button>
        <button type="button" class="primary" id="install-go"></button>
      </footer>
    </section>

    <section class="page" id="page-maintenance" hidden>
      <h1 id="maintenance-heading" tabindex="-1"></h1>
      <p id="maintenance-location" class="path"></p>
      <p id="maintenance-setup"></p>
      <p class="notice" id="maintenance-newer" hidden></p>
      <div class="actions">
        <button type="button" class="primary" id="maintenance-update"></button>
        <button type="button" id="maintenance-modify" data-l10n="ModifyButton"></button>
        <button type="button" id="maintenance-uninstall" data-l10n="UninstallMoreButton"></button>
      </div>
      <footer class="buttons">
        <span class="spacer"></span>
        <button type="button" id="maintenance-close" data-l10n="CloseButton"></button>
      </footer>
    </section>

    <section class="page" id="page-uninstall" hidden>
      <h1 id="uninstall-heading" tabindex="-1"></h1>
      <p data-l10n="UninstallText"></p>
      <label class="check"><input type="checkbox" id="remove-app-data"><span data-l10n="RemoveAppDataLabel"></span></label>
      <footer class="buttons">
        <button type="button" id="uninstall-back" data-l10n="BackButton" hidden></button>
        <span class="spacer"></span>
        <button type="button" id="uninstall-cancel" data-l10n="CancelButton"></button>
        <button type="button" class="primary" id="uninstall-go" data-l10n="UninstallButton"></button>
      </footer>
    </section>

    <section class="page" id="page-progress" hidden>
      <h1 id="progress-heading" tabindex="-1"></h1>
      <p id="progress-status" aria-live="polite"></p>
      <progress id="progress-bar" max="1"></progress>
      <p class="hint" id="progress-detail"></p>
      <details>
        <summary data-l10n="DetailsLabel"></summary>
        <pre id="log" tabindex="0"></pre>
      </details>
      <footer class="buttons">
        <span class="spacer"></span>
        <button type="button" id="progress-cancel" data-l10n="CancelButton" hidden></button>
      </footer>
    </section>

    <section class="page" id="page-done" hidden>
      <div class="result">
        <span class="result-icon" id="done-icon" aria-hidden="true"></span>
        <h1 id="done-heading" tabindex="-1"></h1>
      </div>
      <p id="done-text"></p>
      <footer class="buttons">
        <button type="button" id="done-log" data-l10n="OpenLogButton"></button>
        <span class="spacer"></span>
        <button type="button" id="done-launch" data-l10n="LaunchButton" hidden></button>
        <button type="button" class="primary" id="done-close" data-l10n="CloseButton"></button>
      </footer>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
