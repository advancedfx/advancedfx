[package]
name = "hlae-installer-core"
version = "0.1.0"
authors = ["advancedfx.org <contact@advancedfx.org>"]
license = "MIT"
homepage = "https://github.com/advancedfx"
repository = "https://github.com/advancedfx/advancedfx"
edition = "2024"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
# Same versions as Tauri uses, see Cargo.lock.
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
# Unpacking only: flate2 with the pure Rust zlib-rs backend, no zopfli (a compressor we don't need).
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"

[dev-dependencies]
# The integration tests (tests/) pack test payloads with it.
hlae-installer-build-support = { path = "../build-support" }
tempfile = "3"
